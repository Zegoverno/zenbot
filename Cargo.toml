[workspace]
resolver = "2"
members = ["crates/zend", "crates/zen", "crates/zen-engine", "crates/zen-proto", "crates/zen-client"]
# The Matrix channel is a workspace of its own: matrix-sdk's SQLite clashes with sqlx's `links`, and its
# heavy dependencies stay out of the kernel's build (docs/matrix.md, D-049).
exclude = ["crates/zen-matrix"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[profile.release]
# Smaller binaries to download and install; panics still print a message.
strip = true

# The binaries CI publishes (.github/workflows/ci.yml, job `release`): the release build with
# whole-program optimization, 25–30% smaller (2026-10-14: zen 6.6 → 4.8 MB, zend 16.5 → 12.6 MB;
# budgets in scripts/size-budget.sh). Local
# builds, tests and clippy stay on `release`, which compiles much faster; scripts install either
# kind from target/release (scripts/fetch-release.sh puts downloaded ones there).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
