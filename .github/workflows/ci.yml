# Checks every pull request and every push to main with scripts/check.sh, exactly as it runs
# locally: the docs check (a PROGRESS.md entry on a pull request), build, unit tests, clippy with
# warnings as errors, the binaries' size budgets, and the kernel's end-to-end scenarios
# (scripts/e2e.sh: the scripted faux model, throwaway databases); each step's time goes to the
# job's summary. For a push to main that passes, `release` then publishes Linux binaries, so
# installs and upgrades download them instead of compiling (scripts/fetch-release.sh). Assets go to
# the rolling `edge` release, one tarball per commit; the newest 20 are kept. The binaries it
# publishes (the `dist` build) pass the same end-to-end scenarios first.
#
# Third-party actions are pinned by commit (the tag in the comment): a moved tag can't change
# what runs with this repository's token. Bump them deliberately.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its running check; runs on main all finish, so every
# commit there that passes gets its binaries.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the docs check compares with the base branch
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tools for the end-to-end scenarios
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap jq poppler-utils python3
      - name: Docs, build, tests, clippy, sizes, end-to-end (scripts/check.sh)
        run: CARGO_BUILD_JOBS=4 scripts/check.sh

  # The Matrix channel is its own Cargo workspace (crates/zen-matrix): built, tested and linted apart,
  # and not part of the release tarball (scripts/matrix.sh builds it where it's used).
  matrix:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: crates/zen-matrix
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/zen-matrix
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

  release:
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Oldest supported Ubuntu runner: binaries built against its glibc run on newer distros too.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dist
      - name: Build
        # The `dist` profile (Cargo.toml): the release build with whole-program optimization, smaller.
        run: cargo build --profile dist --locked
      - name: Check the binaries start
        run: |
          PONG=$(echo '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}' | timeout 15 target/dist/zen-engine | head -1 || true)
          echo "$PONG" | grep -q pong || { echo "zen-engine did not answer ping: $PONG"; exit 1; }
          target/dist/zen --version
      - name: Size budgets of the binaries to publish
        run: scripts/size-budget.sh target/dist
      - name: Tools for the end-to-end scenarios
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap jq poppler-utils python3
      - name: End-to-end scenarios on the binaries to publish
        run: ZEN_E2E_NO_BUILD=1 ZEN_E2E_BIN=target/dist scripts/e2e.sh
      - name: Package
        # A flat tarball (zend, zen, zen-engine, VERSION), as scripts/fetch-release.sh expects.
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          mkdir -p dist/zenbot
          cp target/dist/zend target/dist/zen target/dist/zen-engine dist/zenbot/
          echo "$SHA" > dist/zenbot/VERSION
          tar -C dist/zenbot -czf "dist/zenbot-x86_64-linux-$SHA.tar.gz" .
          (cd dist && sha256sum "zenbot-x86_64-linux-$SHA.tar.gz" > "zenbot-x86_64-linux-$SHA.tar.gz.sha256")
      - name: Publish to the edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view edge >/dev/null 2>&1 || \
            gh release create edge --prerelease --title "edge (latest main)" \
              --notes "Binaries for recent commits on main, used by install.sh and scripts/upgrade.sh."
          gh release upload edge dist/zenbot-x86_64-linux-*.tar.gz dist/zenbot-x86_64-linux-*.sha256 --clobber
          # Keep the 20 newest builds.
          gh release view edge --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[40:] | .[].name' |
            while read -r name; do gh release delete-asset edge "$name" --yes; done
