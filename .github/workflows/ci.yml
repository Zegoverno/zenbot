# One job: scripts/check.sh (build, unit tests, clippy, end-to-end scenarios), exactly as it runs
# locally. A safety net, not a release pipeline: upgrades build from the checkout (scripts/upgrade.sh).
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tools for the end-to-end scenarios
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq poppler-utils python3 bubblewrap passt
      - name: Let the agent sandbox make user namespaces (Ubuntu 24.04's AppArmor restricts them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build, tests, clippy, end-to-end (scripts/check.sh)
        run: CARGO_BUILD_JOBS=4 scripts/check.sh
