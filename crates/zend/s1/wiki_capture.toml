# `capture`: which wiki page a note belongs to (the candidates come from search), whether that page
# already records it, and whether it holds secrets or private data.
name = "wiki_capture"
version = 1
description = "Which page is this note about, is it already there, is it sensitive?"
exposure = "private"
evidence = ["note", "pages"]
timeout = "30s"
unavailable = "add"

[question.page]
type = "choice"
text = "Which wiki page is this note about? One page per concept, entity, decision or project."
options_from = "candidates"

[question.known]
type = "yes/no"
text = "Does the page you chose already record what this note says (in its summary or timeline)?"
yes = "Already recorded"
no = "Something new"

[question.sensitive]
type = "yes/no"
text = "Does the note hold secrets (passwords, keys, tokens) or private personal data that shouldn't be kept in notes?"
yes = "Sensitive"
no = "Fine to keep"

# `skip` applies only to an existing page; the caller adds to a new page regardless.
[policy]
kind = "rules"
else = "add"

[[policy.rule]]
when = "sensitive >= 0.8"
decide = "refuse"

[[policy.rule]]
when = "known >= 0.8"
decide = "skip"

[[test]]
answers = { page = "rust", known = 0.1, sensitive = 0.0 }
expect = "add"

[[test]]
answers = { page = "rust", known = 0.9, sensitive = 0.0 }
expect = "skip"

[[test]]
answers = { page = "rust", known = 0.9, sensitive = 0.95 }
expect = "refuse"
