<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zenbot</title>
<style>
:root {
  --bg: #f6f7f5; --panel: #ffffff; --fg: #1b1f1d; --muted: #6a726d; --line: #dfe3df;
  --accent: #2f6f5e; --accent-fg: #ffffff; --user: #e7efe9; --code: #eef1ee; --err: #b3261e; --warn: #8a6d00;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111412; --panel: #181c1a; --fg: #e3e8e4; --muted: #8f9892; --line: #2a302c;
    --accent: #6fbfa6; --accent-fg: #0d1210; --user: #1f2a25; --code: #1d2320; --err: #f2b8b5; --warn: #e5c75b; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 10px; }
.brand b { font-size: 17px; letter-spacing: .02em; }
.new { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 6px 12px; }
.tabs { display: flex; gap: 4px; padding: 0 14px 10px; }
.tabs button { flex: 1; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px; color: var(--muted); }
.tabs button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
.list { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
.item { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; }
.item:hover { background: var(--code); }
.item[aria-current="true"] { background: var(--user); }
.item .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .m { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header .title { font-weight: 600; flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header select, header button { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; max-width: 200px; }
.cost { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.menu { display: none; background: none; border: 0; font-size: 20px; padding: 0 6px; }
#log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 820px; width: 100%; margin: 0 auto; }
.msg.user .body { background: var(--user); border-radius: 12px; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant .body { overflow-wrap: anywhere; }
.msg .meta { font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
.body p { margin: 0 0 8px; }
.body pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; font: 13px/1.45 var(--mono); }
.body code { font-family: var(--mono); font-size: 13px; background: var(--code); padding: 1px 4px; border-radius: 4px; }
.body pre code { background: none; padding: 0; }
details.tool { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: var(--panel); }
details.tool summary { padding: 6px 10px; font: 13px var(--mono); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.tool .st { color: var(--muted); }
details.tool.error .st { color: var(--err); }
details.tool pre { margin: 0; padding: 8px 10px; border-top: 1px solid var(--line); font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow-y: auto; }
.thinking { color: var(--muted); font-style: italic; font-size: 13px; }
.error { color: var(--err); font-size: 13px; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
form.composer { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--panel); }
textarea { flex: 1; resize: none; min-height: 44px; max-height: 200px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
textarea:focus, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.send { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 0 16px; }
.send.stop { background: var(--err); color: var(--bg); }
.login { margin: auto; display: grid; gap: 10px; width: min(360px, 90vw); }
.login input { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 0 20% 0 0; z-index: 10; transform: translateX(-105%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.25); }
  body.nav aside { transform: none; }
  .menu { display: block; }
}
@media (prefers-reduced-motion: reduce) { aside { transition: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (n) => "$" + (n || 0).toFixed(n >= 1 ? 2 : 4);

let token = localStorage.getItem("zen_token") || new URLSearchParams(location.search).get("token") || "";
if (new URLSearchParams(location.search).get("token")) { localStorage.setItem("zen_token", token); history.replaceState(null, "", location.pathname); }

const state = { archived: false, sessions: [], current: null, models: [], defaultModel: "", ws: null, busy: false, live: null, cards: {} };

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, ...(opts.headers || {}) } });
  if (res.status === 401) { localStorage.removeItem("zen_token"); token = ""; renderLogin("That token didn't work."); throw new Error("unauthorized"); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function renderLogin(msg = "") {
  $("#root").innerHTML = `<form class="login" id="login"><b>zenbot</b><label for="tok">Access token</label>
    <input id="tok" type="password" autocomplete="current-password" required><button class="new" type="submit">Open</button>
    <span class="error">${esc(msg)}</span></form>`;
  $("#login").onsubmit = (e) => { e.preventDefault(); token = $("#tok").value.trim(); localStorage.setItem("zen_token", token); boot(); };
}

function shell() {
  $("#root").innerHTML = `<div class="app">
    <aside>
      <div class="brand"><b>zenbot</b><button class="new" id="new" type="button">New</button></div>
      <div class="tabs"><button id="tab-active" type="button" aria-pressed="true">Active</button><button id="tab-arch" type="button" aria-pressed="false">Archived</button></div>
      <nav class="list" id="list"></nav>
    </aside>
    <main>
      <header>
        <button class="menu" id="menu" type="button" aria-label="Sessions">☰</button>
        <span class="title" id="title">zenbot</span>
        <select id="model" aria-label="Model"></select>
        <span class="cost" id="cost"></span>
        <button id="archive" type="button" hidden>Archive</button>
      </header>
      <div id="log"><div class="empty">Start a new session, or pick one from the list.</div></div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Message zenbot…" disabled></textarea>
        <button class="send" id="send" type="submit" disabled>Send</button>
      </form>
    </main></div>`;
  $("#new").onclick = newSession;
  $("#tab-active").onclick = () => setTab(false);
  $("#tab-arch").onclick = () => setTab(true);
  $("#menu").onclick = () => document.body.classList.toggle("nav");
  $("#archive").onclick = toggleArchive;
  $("#model").onchange = async (e) => { if (!state.current) return; state.current = { ...state.current, ...(await api(`/sessions/${state.current.id}`, { method: "PATCH", body: JSON.stringify({ model: e.target.value }) })) }; };
  const input = $("#input");
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(max-width: 760px)").matches) { e.preventDefault(); $("#composer").requestSubmit(); } });
  $("#composer").onsubmit = (e) => { e.preventDefault(); if (state.busy) return abort(); send(); };
}

async function boot() {
  if (!token) return renderLogin();
  shell();
  try {
    const m = await api("/models");
    state.models = m.models; state.defaultModel = m.default;
    if (!m.authenticated?.openai) $("#log").innerHTML = `<div class="empty">The model worker isn't signed in to ChatGPT yet.<br>Run the <code>pi-ai login openai</code> step, then reload.</div>`;
  } catch (e) { if (e.message === "unauthorized") return; }
  await loadSessions();
  const last = localStorage.getItem("zen_session");
  if (last && state.sessions.some((s) => s.id === last)) openSession(last);
}

function setTab(archived) {
  state.archived = archived;
  $("#tab-active").setAttribute("aria-pressed", String(!archived));
  $("#tab-arch").setAttribute("aria-pressed", String(archived));
  loadSessions();
}

async function loadSessions() {
  state.sessions = await api(`/sessions?archived=${state.archived}`);
  $("#list").innerHTML = state.sessions.length ? state.sessions.map((s) => `<button class="item" type="button" data-id="${s.id}" ${state.current?.id === s.id ? 'aria-current="true"' : ""}>
      <span class="t">${esc(s.title || "Untitled session")}</span>
      <span class="m">${esc(s.model.split("/")[1] || s.model)} · ${money(s.cost)} · ${new Date(s.updated_at).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}</span></button>`).join("")
    : `<p class="m" style="padding:8px 10px;color:var(--muted)">${state.archived ? "No archived sessions." : "No sessions yet."}</p>`;
  $("#list").querySelectorAll(".item").forEach((b) => (b.onclick = () => { openSession(b.dataset.id); document.body.classList.remove("nav"); }));
}

async function newSession() {
  const s = await api("/sessions", { method: "POST", body: JSON.stringify({ model: $("#model").value || state.defaultModel }) });
  if (state.archived) setTab(false); else await loadSessions();
  openSession(s.id);
  document.body.classList.remove("nav");
}

async function toggleArchive() {
  if (!state.current) return;
  await api(`/sessions/${state.current.id}`, { method: "PATCH", body: JSON.stringify({ archived: !state.current.archived }) });
  state.current = null; localStorage.removeItem("zen_session");
  $("#log").innerHTML = `<div class="empty">Session ${state.archived ? "restored" : "archived"}.</div>`;
  $("#archive").hidden = true; $("#title").textContent = "zenbot"; setComposer(false);
  loadSessions();
}

function renderModels(selected) {
  const sel = $("#model");
  const ids = state.models.map((m) => m.id);
  if (selected && !ids.includes(selected)) ids.unshift(selected);
  sel.innerHTML = ids.map((id) => `<option value="${esc(id)}" ${id === selected ? "selected" : ""}>${esc(id.split("/")[1] || id)}</option>`).join("");
}

async function openSession(id) {
  const s = await api(`/sessions/${id}`);
  state.current = s; state.cards = {}; state.live = null;
  localStorage.setItem("zen_session", id);
  $("#title").textContent = s.title || "Untitled session";
  $("#archive").hidden = false; $("#archive").textContent = s.archived ? "Restore" : "Archive";
  renderModels(s.model);
  $("#cost").textContent = money(s.cost);
  const log = $("#log"); log.innerHTML = "";
  if (!s.messages.length) log.innerHTML = `<div class="empty">Ask zenbot anything. It can run commands and edit files on the VM.</div>`;
  s.messages.forEach(renderMessage);
  setBusy(s.busy);
  setComposer(!s.archived);
  loadSessions();
  connect(id);
  scrollDown(true);
}

function connect(id) {
  if (state.ws) { state.ws.onclose = null; state.ws.close(); }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/api/sessions/${id}/ws?token=${encodeURIComponent(token)}`);
  state.ws = ws;
  ws.onmessage = (e) => onEvent(JSON.parse(e.data));
  ws.onclose = () => { if (state.current?.id === id) setTimeout(() => state.current?.id === id && openSession(id), 1500); };
}

function setComposer(on) { $("#input").disabled = !on; $("#send").disabled = !on; }
function setBusy(b) { state.busy = b; const s = $("#send"); s.textContent = b ? "Stop" : "Send"; s.classList.toggle("stop", b); }
function scrollDown(force) { const log = $("#log"); if (force || log.scrollHeight - log.scrollTop - log.clientHeight < 160) log.scrollTop = log.scrollHeight; }

function send() {
  const text = $("#input").value.trim();
  if (!text || !state.ws || state.ws.readyState !== 1) return;
  state.ws.send(JSON.stringify({ type: "prompt", text }));
  $("#input").value = ""; $("#input").style.height = "auto";
}
function abort() { state.ws?.send(JSON.stringify({ type: "abort" })); }

function md(text) {
  const parts = String(text ?? "").split(/```/);
  return parts.map((p, i) => {
    if (i % 2) { const nl = p.indexOf("\n"); return `<pre><code>${esc(nl >= 0 ? p.slice(nl + 1) : p)}</code></pre>`; }
    return esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
      .split(/\n{2,}/).map((para) => para.trim() ? `<p>${para.replace(/\n/g, "<br>")}</p>` : "").join("");
  }).join("");
}

function el(html) { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }
function clearEmpty() { $("#log .empty")?.remove(); }

function toolSummary(name, args) {
  const a = args || {};
  const detail = a.command ?? a.path ?? (a.from ? `${a.from} → ${a.to}` : JSON.stringify(a));
  return `${esc(name)} <span class="st">${esc(String(detail).slice(0, 140))}</span>`;
}

function renderMessage(m) {
  clearEmpty();
  const log = $("#log");
  if (m.role === "user") {
    const text = typeof m.content === "string" ? m.content : (m.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
    log.append(el(`<div class="msg user"><div class="body">${esc(text)}</div></div>`));
  } else if (m.role === "assistant") {
    state.live?.remove(); state.live = null;
    const box = el(`<div class="msg assistant"><div class="body"></div></div>`);
    const body = box.firstElementChild;
    for (const c of m.content || []) {
      if (c.type === "text") body.insertAdjacentHTML("beforeend", md(c.text));
      else if (c.type === "thinking" && c.thinking) body.insertAdjacentHTML("beforeend", `<p class="thinking">${esc(c.thinking.slice(0, 400))}</p>`);
      else if (c.type === "toolCall") {
        const card = el(`<details class="tool"><summary>${toolSummary(c.name, c.arguments)}</summary><pre>${esc(JSON.stringify(c.arguments, null, 2))}</pre></details>`);
        state.cards[c.id] = card; body.append(card);
      }
    }
    if (m.stopReason === "error" && m.errorMessage) body.insertAdjacentHTML("beforeend", `<p class="error">${esc(m.errorMessage)}</p>`);
    const u = m.usage || {};
    box.insertAdjacentHTML("beforeend", `<div class="meta">${esc(m.model || "")} · ${u.input || 0} in / ${u.output || 0} out${u.cacheRead ? ` / ${u.cacheRead} cached` : ""} · ${money(u.cost?.total)}</div>`);
    log.append(box);
  } else if (m.role === "toolResult") {
    const card = state.cards[m.toolCallId];
    const text = (m.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
    if (card) { card.classList.toggle("error", !!m.isError); card.insertAdjacentHTML("beforeend", `<pre>${esc(text)}</pre>`); }
  }
  scrollDown();
}

function onEvent(ev) {
  switch (ev.type) {
    case "message": renderMessage(ev.message); break;
    case "delta": {
      clearEmpty();
      if (!state.live) { state.live = el(`<div class="msg assistant"><div class="body"></div></div>`); state.live.raw = ""; $("#log").append(state.live); }
      state.live.raw += ev.delta || ""; state.live.firstElementChild.innerHTML = md(state.live.raw); scrollDown(); break;
    }
    case "busy": setBusy(ev.busy); break;
    case "tool_start": { const c = state.cards[ev.call_id]; if (c) c.querySelector(".st").insertAdjacentText("afterbegin", "running… "); break; }
    case "tool_end": { const c = state.cards[ev.call_id]; if (c) { c.classList.toggle("error", ev.is_error); const st = c.querySelector(".st"); st.textContent = st.textContent.replace("running… ", "") + ` · ${ev.ms}ms`; } break; }
    case "end":
      setBusy(false); state.live?.remove(); state.live = null;
      if (ev.cost !== undefined) $("#cost").textContent = money(ev.cost);
      if (ev.error) $("#log").append(el(`<div class="msg"><p class="error">${esc(ev.error)}</p></div>`));
      loadSessions(); scrollDown(); break;
    case "error": $("#log").append(el(`<div class="msg"><p class="error">${esc(ev.error)}</p></div>`)); scrollDown(); break;
  }
}

boot();
</script>
</body>
</html>
