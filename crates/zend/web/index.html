<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)">
<title>zenbot</title>
<style>
/* Layout: a calm two-pane chat. Sessions on the left (drawer on phones), one focused conversation on the right. */
:root {
  --bg: #f7f7f5; --panel: #ffffff; --fg: #1c1f1d; --muted: #6d746f; --faint: #a3aaa5; --line: #e4e6e2;
  --accent: #2c6b5a; --accent-fg: #ffffff; --user: #eceee9; --code: #f0f1ee; --hover: #eff1ed;
  --err: #b3261e; --ok: #2c6b5a;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121413; --panel: #181b19; --fg: #e6e9e6; --muted: #959d98; --faint: #5f6762; --line: #262b28;
    --accent: #79c4ad; --accent-fg: #0f1311; --user: #222724; --code: #1e2320; --hover: #1f2421;
    --err: #f2a8a3; --ok: #79c4ad; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#root { height: 100dvh; }
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }

/* Sidebar */
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-top: env(safe-area-inset-top, 0px); }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 8px 18px; }
.logo { font-weight: 650; letter-spacing: -.01em; font-size: 17px; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.new-btn { display: flex; align-items: center; gap: 8px; margin: 4px 12px 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); color: var(--fg); font-size: 15px; }
.new-btn:hover { background: var(--hover); }
.list { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
.group-label { font-size: 12px; color: var(--muted); padding: 12px 10px 4px; }
.item { display: block; width: 100%; text-align: left; border-radius: 8px; padding: 7px 10px; font-size: 14.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item:hover { background: var(--hover); }
.item[aria-current="true"] { background: var(--user); font-weight: 550; }
.side-foot { border-top: 1px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); }
.link-btn { font-size: 14px; color: var(--muted); padding: 6px 6px; border-radius: 6px; }
.link-btn:hover { color: var(--fg); background: var(--hover); }
.scrim { display: none; }

/* Main */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding-top: env(safe-area-inset-top, 0px); }
.top { display: flex; align-items: center; gap: 6px; height: 52px; padding: 0 10px 0 16px; flex: none; }
.top .title { flex: 1; min-width: 0; font-size: 15px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-btn, .top-new { display: none; }
.more { position: relative; }
.more-menu { position: absolute; right: 0; top: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 4px; min-width: 160px; z-index: 5; }
.more-menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; font-size: 14.5px; }
.more-menu button:hover { background: var(--hover); }

#scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.thread { max-width: 760px; margin: 0 auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 22px; }
.user-msg { align-self: flex-end; max-width: 85%; background: var(--user); border-radius: 18px; padding: 9px 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.turn { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.prose { overflow-wrap: anywhere; min-width: 0; }
.prose > :first-child { margin-top: 0; } .prose > :last-child { margin-bottom: 0; }
.prose p { margin: 0 0 10px; }
.prose h1, .prose h2, .prose h3 { font-size: 1.05em; margin: 16px 0 6px; line-height: 1.3; }
.prose ul, .prose ol { margin: 0 0 10px; padding-left: 22px; }
.prose li { margin: 2px 0; }
.prose a { color: var(--accent); }
.prose code { font: .87em var(--mono); background: var(--code); padding: 1px 5px; border-radius: 5px; }
.prose pre { background: var(--code); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 10px; }
.prose pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
.prose blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }

.tool { font-size: 14px; }
.tool > summary { list-style: none; display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; padding: 3px 0; min-width: 0; }
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { color: var(--fg); }
.tool .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.tool.running .dot { background: var(--accent); animation: pulse 1s infinite; }
.tool.done .dot { background: var(--ok); }
.tool.error .dot { background: var(--err); }
.tool .name { color: var(--fg); font-weight: 550; flex: none; }
.tool .arg { font-family: var(--mono); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tool .ms { margin-left: auto; font-size: 12px; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
.tool pre { margin: 6px 0 4px 16px; background: var(--code); border-radius: 8px; padding: 10px 12px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; }
.tool .label { margin: 8px 0 0 16px; font-size: 12px; color: var(--muted); }
.meta { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.working { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.working i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite; }
.working i:nth-child(2) { animation-delay: .2s; } .working i:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.error { color: var(--err); font-size: 14px; }

.welcome { max-width: 560px; margin: 0 auto; padding: 18vh 24px 24px; }
.welcome h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px; }
.welcome p { color: var(--muted); margin: 0 0 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font-size: 14px; color: var(--fg); background: var(--panel); text-align: left; }
.chip:hover { background: var(--hover); }
.notice { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 18px; }

/* Composer */
.composer-wrap { flex: none; padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.composer { max-width: 760px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 8px 8px 8px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.composer:focus-within { border-color: var(--faint); }
.composer textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent; padding: 6px 0; max-height: 40dvh; min-height: 28px; line-height: 1.45; }
.composer-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.model { appearance: none; border: 0; background: var(--hover); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); max-width: 60%; cursor: pointer; }
.spacer { flex: 1; }
.send { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--fg); color: var(--bg); }
.send:disabled { opacity: .3; cursor: default; }
.send svg { width: 18px; height: 18px; stroke-width: 2.2; }

/* Login */
.login { height: 100%; display: grid; place-items: center; padding: 24px; }
.login form { width: min(340px, 100%); display: grid; gap: 12px; }
.login input { border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; background: var(--panel); }
.login button { background: var(--fg); color: var(--bg); border-radius: 12px; padding: 11px; font-weight: 550; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; inset: 0 auto 0 0; width: min(300px, 84vw); z-index: 20; transform: translateX(-102%); transition: transform .22s ease; }
  body.nav aside { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  body.nav .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 15; }
  .menu-btn, .top-new { display: inline-grid; }
  .top { padding: 0 6px; }
  .top .title { text-align: center; }
  .thread { padding: 4px 16px 20px; }
  .welcome { padding-top: 10vh; }
  .composer-wrap { padding: 6px 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { aside { transition: none; } .tool.running .dot, .working i { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON = {
  menu: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/></svg>',
};
const fmtTokens = (n) => (n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n || 0));
const fmtCost = (n) => (n ? "≈$" + (n < 0.01 ? n.toFixed(4) : n.toFixed(2)) : "");

let token = new URLSearchParams(location.search).get("token") || localStorage.getItem("zen_token") || "";
if (new URLSearchParams(location.search).get("token")) { localStorage.setItem("zen_token", token); history.replaceState(null, "", location.pathname); }

const S = { archived: false, sessions: [], current: null, models: [], defaultModel: "", signedIn: true, ws: null, busy: false, turn: null, cards: {} };

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token } });
  if (res.status === 401) { localStorage.removeItem("zen_token"); token = ""; renderLogin("That token didn't work. Check ~/.zenbot/token on the VM."); throw new Error("unauthorized"); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ---------- screens ----------

function renderLogin(msg = "") {
  $("#root").innerHTML = `<div class="login"><form id="login">
    <div class="logo">zenbot</div>
    <label for="tok">Access token</label>
    <input id="tok" type="password" autocomplete="current-password" required>
    <button type="submit">Continue</button>
    <span class="error">${esc(msg)}</span></form></div>`;
  $("#login").onsubmit = (e) => { e.preventDefault(); token = $("#tok").value.trim(); localStorage.setItem("zen_token", token); boot(); };
}

function renderShell() {
  $("#root").innerHTML = `<div class="app">
    <aside>
      <div class="side-head"><span class="logo">zenbot</span></div>
      <button class="new-btn" id="new" type="button">${ICON.edit} New session</button>
      <nav class="list" id="list" aria-label="Sessions"></nav>
      <div class="side-foot"><button class="link-btn" id="toggle-arch" type="button">Archived sessions</button></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main>
      <div class="top">
        <button class="icon-btn menu-btn" id="menu" type="button" aria-label="Sessions">${ICON.menu}</button>
        <span class="title" id="title"></span>
        <div class="more" id="more-wrap" hidden>
          <button class="icon-btn" id="more" type="button" aria-label="Session options">${ICON.more}</button>
          <div class="more-menu" id="more-menu" hidden><button type="button" id="archive">Archive</button></div>
        </div>
        <button class="icon-btn top-new" id="top-new" type="button" aria-label="New session">${ICON.edit}</button>
      </div>
      <div id="scroll"><div id="view"></div></div>
      <div class="composer-wrap"><form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Ask zenbot to do something…" aria-label="Message"></textarea>
        <div class="composer-row">
          <select class="model" id="model" aria-label="Model"></select>
          <span class="spacer"></span>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>${ICON.up}</button>
        </div>
      </form></div>
    </main></div>`;
  $("#new").onclick = $("#top-new").onclick = () => { closeNav(); showWelcome(); };
  $("#menu").onclick = () => document.body.classList.add("nav");
  $("#scrim").onclick = closeNav;
  $("#toggle-arch").onclick = () => { S.archived = !S.archived; $("#toggle-arch").textContent = S.archived ? "Back to sessions" : "Archived sessions"; loadSessions(); };
  $("#more").onclick = (e) => { e.stopPropagation(); $("#more-menu").hidden = !$("#more-menu").hidden; };
  document.addEventListener("click", () => ($("#more-menu") && ($("#more-menu").hidden = true)));
  $("#archive").onclick = toggleArchive;
  $("#model").onchange = async (e) => {
    if (S.current) S.current = { ...S.current, ...(await api(`/sessions/${S.current.id}`, { method: "PATCH", body: JSON.stringify({ model: e.target.value }) })) };
    localStorage.setItem("zen_model", e.target.value);
  };
  const input = $("#input");
  input.addEventListener("input", () => { autosize(); updateSend(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); $("#composer").requestSubmit(); }
  });
  $("#composer").onsubmit = (e) => { e.preventDefault(); S.busy ? abort() : send(); };
}

const closeNav = () => document.body.classList.remove("nav");
function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
function updateSend() {
  const b = $("#send");
  b.innerHTML = S.busy ? ICON.stop : ICON.up;
  b.setAttribute("aria-label", S.busy ? "Stop" : "Send");
  b.disabled = !S.busy && (!$("#input").value.trim() || S.current?.archived);
}

async function boot() {
  if (!token) return renderLogin();
  renderShell();
  try {
    const m = await api("/models");
    S.models = m.models; S.defaultModel = m.default; S.signedIn = !!m.authenticated?.openai;
  } catch (e) { if (e.message === "unauthorized") return; }
  renderModels(localStorage.getItem("zen_model") || S.defaultModel);
  await loadSessions();
  const last = localStorage.getItem("zen_session");
  if (last && S.sessions.some((s) => s.id === last)) openSession(last); else showWelcome();
}

function renderModels(selected) {
  const ids = S.models.map((m) => m.id);
  if (!ids.includes(selected)) selected = S.defaultModel;
  $("#model").innerHTML = S.models.map((m) => `<option value="${esc(m.id)}" ${m.id === selected ? "selected" : ""}>${esc(m.name)}</option>`).join("");
}

function dayLabel(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = (t - new Date(d).setHours(0, 0, 0, 0)) / 864e5;
  return diff <= 0 ? "Today" : diff === 1 ? "Yesterday" : diff < 7 ? "This week" : "Older";
}

async function loadSessions() {
  S.sessions = await api(`/sessions?archived=${S.archived}`);
  let html = "", last = "";
  for (const s of S.sessions) {
    const g = S.archived ? "Archived" : dayLabel(s.updated_at);
    if (g !== last) { html += `<div class="group-label">${g}</div>`; last = g; }
    html += `<button class="item" type="button" data-id="${s.id}" ${S.current?.id === s.id ? 'aria-current="true"' : ""}>${esc(s.title || "New session")}</button>`;
  }
  $("#list").innerHTML = html || `<div class="group-label">${S.archived ? "No archived sessions" : "No sessions yet"}</div>`;
  $("#list").querySelectorAll(".item").forEach((b) => (b.onclick = () => { closeNav(); openSession(b.dataset.id); }));
}

const EXAMPLES = [
  "What's running on this machine right now?",
  "Create a folder called hello with a Python script that prints today's date, then run it",
  "Summarize what's in my home directory",
];

function showWelcome() {
  disconnect();
  S.current = null; S.turn = null; S.cards = {};
  localStorage.removeItem("zen_session");
  $("#title").textContent = "";
  $("#more-wrap").hidden = true;
  $("#view").innerHTML = `<div class="welcome">
    ${S.signedIn ? "" : `<div class="notice">zenbot isn't signed in to ChatGPT yet. Run the sign-in step on the VM, then reload this page.</div>`}
    <h1>What should we work on?</h1>
    <p>zenbot runs commands and edits files on your VM. Type below to start a new session.</p>
    <div class="chips">${EXAMPLES.map((x) => `<button class="chip" type="button">${esc(x)}</button>`).join("")}</div></div>`;
  $("#view").querySelectorAll(".chip").forEach((c) => (c.onclick = () => { $("#input").value = c.textContent; autosize(); updateSend(); $("#input").focus(); }));
  S.busy = false; updateSend();
  loadSessions();
  $("#input").focus();
}

async function openSession(id) {
  const s = await api(`/sessions/${id}`);
  S.current = s; S.turn = null; S.cards = {};
  localStorage.setItem("zen_session", id);
  $("#title").textContent = s.title || "New session";
  $("#more-wrap").hidden = false;
  $("#archive").textContent = s.archived ? "Restore" : "Archive";
  renderModels(s.model);
  $("#view").innerHTML = `<div class="thread" id="thread"></div>`;
  s.messages.forEach((m) => renderMessage(m));
  closeTurn();
  S.busy = s.busy; updateSend();
  if (s.busy) showWorking();
  loadSessions();
  connect(id);
  scrollDown(true);
}

async function toggleArchive() {
  if (!S.current) return;
  await api(`/sessions/${S.current.id}`, { method: "PATCH", body: JSON.stringify({ archived: !S.current.archived }) });
  showWelcome();
}

// ---------- live connection ----------

function disconnect() { if (S.ws) { S.ws.onclose = null; S.ws.close(); S.ws = null; } }

function connect(id) {
  disconnect();
  return new Promise((resolve) => {
    const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/sessions/${id}/ws?token=${encodeURIComponent(token)}`);
    S.ws = ws;
    ws.onopen = () => resolve(ws);
    ws.onmessage = (e) => onEvent(JSON.parse(e.data));
    ws.onclose = () => { if (S.current?.id === id) setTimeout(() => S.current?.id === id && openSession(id), 1500); };
  });
}

async function send() {
  const text = $("#input").value.trim();
  if (!text) return;
  $("#input").value = ""; autosize();
  if (!S.current) {
    const s = await api("/sessions", { method: "POST", body: JSON.stringify({ model: $("#model").value || S.defaultModel }) });
    await openSession(s.id);
  }
  if (!S.ws || S.ws.readyState !== 1) await connect(S.current.id);
  S.ws.send(JSON.stringify({ type: "prompt", text }));
  S.busy = true; updateSend();
}
function abort() { S.ws?.send(JSON.stringify({ type: "abort" })); }

// ---------- rendering ----------

function scrollDown(force) { const sc = $("#scroll"); if (force || sc.scrollHeight - sc.scrollTop - sc.clientHeight < 200) sc.scrollTop = sc.scrollHeight; }
function node(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const thread = () => $("#thread");

function inline(s) {
  return esc(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function md(src) {
  const out = []; const lines = String(src ?? "").replace(/\r/g, "").split("\n");
  let i = 0, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      flush(); const code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h) { flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      flush(); const ordered = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((x) => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (/^>\s?/.test(l)) { flush(); out.push(`<blockquote>${inline(l.replace(/^>\s?/, ""))}</blockquote>`); i++; continue; }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(l); i++;
  }
  flush();
  return out.join("");
}

function openTurn() {
  if (!S.turn) {
    const el = node(`<div class="turn"></div>`);
    thread().append(el);
    S.turn = { el, live: null, model: "", input: 0, output: 0, cost: 0, steps: 0 };
  }
  return S.turn;
}

function closeTurn() {
  const t = S.turn; if (!t) return;
  hideWorking(); t.live?.remove();
  if (t.steps) t.el.append(node(`<div class="meta">${esc(t.model)} · ${fmtTokens(t.input + t.output)} tokens${t.cost ? ` · ${fmtCost(t.cost)} API-equivalent` : ""}</div>`));
  S.turn = null;
}

function showWorking() { const t = openTurn(); if (!t.el.querySelector(".working")) t.el.append(node(`<div class="working"><i></i><i></i><i></i><span>Working</span></div>`)); scrollDown(); }
function hideWorking() { S.turn?.el.querySelector(".working")?.remove(); }

// Only show the input block when it adds something beyond the one-line summary.
function toolInput(name, a = {}) {
  let body = "";
  if (name === "write") body = a.content;
  else if (name === "edit") body = `- ${a.old_text}\n+ ${a.new_text}`;
  else if (!["bash", "read", "move"].includes(name)) body = JSON.stringify(a, null, 2);
  return body ? `<div class="label">Input</div><pre>${esc(body)}</pre>` : "";
}
function toolArg(name, a = {}) { return a.command ?? a.path ?? (a.from ? `${a.from} → ${a.to}` : JSON.stringify(a)); }

function renderMessage(m) {
  if (m.role === "user") {
    closeTurn();
    const text = typeof m.content === "string" ? m.content : (m.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
    thread().append(node(`<div class="user-msg">${esc(text)}</div>`));
  } else if (m.role === "assistant") {
    const t = openTurn();
    hideWorking(); t.live?.remove(); t.live = null;
    for (const c of m.content || []) {
      if (c.type === "text" && c.text.trim()) t.el.append(node(`<div class="prose">${md(c.text)}</div>`));
      else if (c.type === "toolCall") {
        const card = node(`<details class="tool"><summary><span class="dot"></span><span class="name">${esc(c.name)}</span><span class="arg">${esc(String(toolArg(c.name, c.arguments)).slice(0, 200))}</span><span class="ms"></span></summary>
          ${toolInput(c.name, c.arguments)}</details>`);
        S.cards[c.id] = card; t.el.append(card);
      }
    }
    if (m.stopReason === "error" && m.errorMessage) t.el.append(node(`<p class="error">${esc(m.errorMessage)}</p>`));
    const u = m.usage || {};
    t.model = m.model || t.model; t.input += u.input || 0; t.output += u.output || 0; t.cost += u.cost?.total || 0; t.steps++;
  } else if (m.role === "toolResult") {
    const card = S.cards[m.toolCallId];
    const text = (m.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
    if (card) {
      card.classList.remove("running"); card.classList.add(m.isError ? "error" : "done");
      card.append(node(`<div class="label">Output</div>`), node(`<pre>${esc(text)}</pre>`));
    }
  }
  scrollDown();
}

function onEvent(ev) {
  if (!thread()) return;
  switch (ev.type) {
    case "message":
      renderMessage(ev.message);
      if (ev.message.role === "user") { S.busy = true; updateSend(); showWorking(); }
      else if (S.busy) showWorking();
      if (ev.message.role === "user" && S.current && !S.current.title) { S.current.title = ev.message.content.slice(0, 60); $("#title").textContent = S.current.title; loadSessions(); }
      break;
    case "delta": {
      const t = openTurn(); hideWorking();
      if (!t.live) { t.live = node(`<div class="prose"></div>`); t.live.raw = ""; t.el.append(t.live); }
      t.live.raw += ev.delta || ""; t.live.innerHTML = md(t.live.raw); scrollDown(); break;
    }
    case "tool_start": { const c = S.cards[ev.call_id]; if (c) c.classList.add("running"); break; }
    case "tool_end": { const c = S.cards[ev.call_id]; if (c) c.querySelector(".ms").textContent = ev.ms < 1000 ? `${ev.ms}ms` : `${(ev.ms / 1000).toFixed(1)}s`; break; }
    case "end":
      if (ev.error) openTurn().el.append(node(`<p class="error">${esc(ev.error)}</p>`));
      closeTurn(); S.busy = false; updateSend(); loadSessions(); scrollDown(); break;
    case "error":
      openTurn().el.append(node(`<p class="error">${esc(ev.error)}</p>`)); scrollDown(); break;
  }
}

boot();
</script>
</body>
</html>
