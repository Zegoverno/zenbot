# Legacy: the PostgreSQL of installs from before SQLite (D-076), read once by the storage migration
# (scripts/storage.py). zenbot itself needs no Docker; web search is SearXNG, natively (scripts/searxng.sh).
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zen
      # Bootstrap only (Postgres uses it when it first creates the database, and CI and throwaway
      # setups keep it): install.sh and scripts/upgrade.sh replace it with a private password in
      # ~/.zenbot/db-password (db_secure in scripts/db.sh). Changing it here changes nothing later.
      POSTGRES_PASSWORD: zen
      POSTGRES_DB: zen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zen-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zen"]
      interval: 5s
      retries: 10
volumes:
  zen-pg:
