# Postgres (with pgvector) for zenbot, and SearXNG for web search without an API key. zend and its workers run on the host (deploy/zenbot.service, or scripts/dev.sh).
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zen
      POSTGRES_PASSWORD: zen
      POSTGRES_DB: zen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zen-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zen"]
      interval: 5s
      retries: 10
  searxng:
    image: searxng/searxng@sha256:cc026dbee25b864d7f9731957cd5ef36ba2e2d61abd2996d57f1b863483e7409 # pinned; bump deliberately
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
volumes:
  zen-pg:
