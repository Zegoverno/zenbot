# SearXNG for zenbot's web_search when no search API key is set (crates/zend/src/web.rs).
# Bound to 127.0.0.1 only (deploy/compose.yaml); JSON output is what the kernel reads.
use_default_settings: true
general:
  instance_name: zenbot-search
server:
  # A fixed key, public in this repo. That's acceptable here: SearXNG listens on 127.0.0.1 only
  # (deploy/compose.yaml), has no accounts, and the image proxy the key signs for is off. compose
  # doesn't pass SEARXNG_SECRET; adding it to the searxng service's environment would override this.
  secret_key: "zenbot-local-only-change-me"
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 0
  formats:
    - html
    - json
